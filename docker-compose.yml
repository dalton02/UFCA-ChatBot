services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: chatbot
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pg_data:
networks:
  app-network:
    driver: bridge